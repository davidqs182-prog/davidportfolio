  <!-- Header + hero: primera parte de esta página (a pedido de David,
       el resto del contenido del hero todavía no está diseñado). Header
       con los MISMOS botones que project-onboarding/
       project-youtube-discovery (ícono + label en "Back to home", link
       "About") — a pedido de David, no la versión simplificada sin
       ícono que traía el diseño de Figma (node 385:42660).

       El fondo NO es un screenshot único (esa fue la primera versión,
       David la rechazó: "deben ser elementos separados... para que
       sean responsivos posteriormente") — son 3 piezas independientes,
       ver .project-leo__hero-visual más abajo: fondo anaranjado (color
       CSS), imagen (foto de los banners, asset real de Figma) y mockup
       (recorte propio, ver ese comentario). Cada una se puede
       reposicionar/redimensionar por separado en un próximo paso para
       breakpoints angostos, sin depender de una sola imagen plana. -->
  <div class="project-leo__hero-wrap">
    <div class="project-leo__hero-visual" aria-hidden="true">
      <div class="project-leo__hero-bg"></div>
      <img
        class="project-leo__hero-banner"
        src="../assets/images/project-leo-banner.jpg"
        alt=""
        width="1044"
        height="600"
        loading="lazy"
      >
      <!-- Mockup del iPhone, armado con los assets reales de Figma en
           vez de un recorte de screenshot (David: "el teléfono sale
           cortado, exportalo entero" — cualquier recorte de un frame
           limitado a 600px de alto iba a cortar el teléfono, que mide
           912px de alto en el diseño real; la única forma de que
           salga completo es no depender de un screenshot del frame en
           absoluto). Bezel = el asset de hardware real del teléfono
           (nodo 385:44424 "iPhone 16 Pro..."), transparente por fuera
           Y en el hueco de la pantalla — de acá sale completo, sin
           ningún corte, los 4 bordes redondeados incluidos. Encima va
           la pantalla (wallpaper real + dock con los 4 íconos + el
           ícono de Leo, todos assets reales de Figma) posicionada en
           % del bezel (medido en Figma: 6.7%/2.1% desde la esquina,
           86.8%/95.8% de ancho/alto) — así queda dentro del hueco
           transparente pase lo que pase el tamaño final. Barra de
           estado (hora/señal/batería) omitida por ahora — a esta
           escala (el teléfono entero, no solo un recorte) no se
           alcanza a leer igual, no vale la complejidad todavía. -->
      <div class="project-leo__hero-mockup">
        <img
          class="project-leo__mockup-bezel"
          src="../assets/images/project-leo-mockup/bezel.png"
          alt=""
          width="1350"
          height="2760"
        >
        <div class="project-leo__mockup-screen">
          <img
            class="project-leo__mockup-wallpaper"
            src="../assets/images/project-leo-mockup/screen.jpg"
            alt=""
            width="1290"
            height="2796"
          >
          <div class="project-leo__mockup-dock">
            <span class="project-leo__mockup-app-icon project-leo__mockup-app-icon--leo">
              <img src="../assets/images/project-leo-mockup/icon-leo.svg" alt="Leo">
            </span>
            <img class="project-leo__mockup-app-icon" src="../assets/images/project-leo-mockup/icon-messages.svg" alt="">
            <img class="project-leo__mockup-app-icon" src="../assets/images/project-leo-mockup/icon-phone.svg" alt="">
            <span class="project-leo__mockup-app-icon project-leo__mockup-app-icon--camera">
              <img src="../assets/images/project-leo-mockup/icon-camera.svg" alt="">
            </span>
          </div>
        </div>
      </div>
    </div>
