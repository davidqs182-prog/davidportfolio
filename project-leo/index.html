  <!-- Header + hero: primera parte de esta página (a pedido de David,
       el resto del contenido del hero todavía no está diseñado). Header
       con los MISMOS botones que project-onboarding/
       project-youtube-discovery (ícono + label en "Back to home", link
       "About") — a pedido de David, no la versión simplificada sin
       ícono que traía el diseño de Figma (node 385:42660).

       El fondo NO es un screenshot único (esa fue la primera versión,
       David la rechazó: "deben ser elementos separados... para que
       sean responsivos posteriormente") — son 3 piezas independientes,
       ver .project-leo__hero-visual más abajo: fondo anaranjado (color
       CSS), imagen (foto de los banners, asset real de Figma) y mockup
       (recorte propio, ver ese comentario). Cada una se puede
       reposicionar/redimensionar por separado en un próximo paso para
       breakpoints angostos, sin depender de una sola imagen plana. -->
  <div class="project-leo__hero-wrap">
    <div class="project-leo__hero-visual" aria-hidden="true">
      <div class="project-leo__hero-bg"></div>
      <img
        class="project-leo__hero-banner"
        src="../assets/images/project-leo-banner.jpg"
        alt=""
        width="1044"
        height="600"
        loading="lazy"
      >
      <!-- Recorte propio con transparencia real (no un export directo
           de Figma, y no la primera versión JPG que traía el naranja
           horneado adentro — David: "no hiciste separado el mockup del
           fondo anaranjado"). El grupo "Mockup" de Figma no se dejaba
           exportar limpio en aislado (la captura salía con una
           proporción rara, un bug de export de Figma con los blurs/
           bordes redondeados del grupo), así que se armó a mano:
           recorte del screenshot completo del frame (que sí renderiza
           bien) empezando en y=88px (debajo de la franja de botones,
           así tampoco incluye nada horneado de ahí) + colorkey del
           naranja exacto de fondo (#cc6632, muestreado en vivo del PNG
           real) vuelto transparente — con el ícono de Leo del dock
           restaurado aparte (ffmpeg overlay), porque usa ese mismo
           naranja de marca y el colorkey también se lo comía. PNG, no
           JPG — el canal alfa no sobrevive en JPG. -->
      <img
        class="project-leo__hero-mockup"
        src="../assets/images/project-leo-mockup.png"
        alt=""
        width="500"
        height="512"
        loading="lazy"
      >
    </div>

      <div class="navbar container">
        <a href="/" class="btn btn--outline btn--md btn--back" aria-label="Back to home">

          <span class="btn--back__label">Back to home</span>
        </a>
        <nav class="navbar__links">
          <a href="/about/" class="btn btn--outline btn--md">About</a>
          <a href="/#contact" class="btn btn--dark btn--md">Get in Touch</a>
        </nav>

    </header>
