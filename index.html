<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Quirós — Product Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="navbar container">
    <nav class="navbar__links">
      <a href="#work" class="pill pill--active">Work</a>
      <a href="#about" class="pill">About</a>
    </nav>
    <p class="navbar__name">DAVID QUIRÓS</p>
    <a href="#contact" class="btn-dark">Get in Touch</a>
  </header>

  <main>
    <section class="hero container">
      <h1 class="hero__title">Product<br>Designer</h1>

      <div class="scroll-track" id="scrollTrack">
        <div class="sticky-stage">
          <img
            id="stageImg"
            class="stage-img"
            src="assets/animations/hero-guitar-scroll/frames/frame_00000.png"
            alt="Animación de David Quirós tocando guitarra"
            draggable="false"
            width="828"
            height="1108"
          >
          <div class="hint" id="hint">
            <div class="hint-label">Scrollea para reproducir</div>
            <div class="hint-line"></div>
          </div>
        </div>
      </div>

      <h2 class="hero__subtitle" id="work">Work</h2>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
