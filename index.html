<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Quirós — Product Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="navbar container">
    <nav class="navbar__links">
      <a href="#work" class="btn btn--secondary btn--md">Work</a>
      <a href="#about" class="btn btn--secondary btn--md">About</a>
    </nav>
    <p class="navbar__name">DAVID QUIRÓS</p>

  <main>

      <div class="hero__stage">

          class="hero__avatar"

          draggable="false"
          width="828"
          height="1108"

      <h2 class="hero__subtitle" id="work">Work</h2>

  <script src="js/main.js"></script>
