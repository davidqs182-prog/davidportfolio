<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>David Quirós — Product Designer</title>
  <!-- /home es un alias de "/" (la home real y canónica) — este archivo
       solo existe para que la URL /home también funcione, sin duplicar
       contenido indexable. noindex + canonical apuntando a "/" para que
       buscadores nunca traten esto como una página aparte. -->
  <meta http-equiv="refresh" content="0; url=/">
  <link rel="canonical" href="https://pixel-personas.com/">
  <meta name="robots" content="noindex">
  <script>location.replace("/");</script>
</head>
<body>
  <p>Redirecting to <a href="/">pixel-personas.com</a>…</p>
</body>
</html>
